[project]
name = "minug-training"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "numpy>=2,<3",
  "torch>=2.13,<2.14",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
